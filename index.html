<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Nilai & IPK Terpadu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Custom dynamic colors utilizing CSS Variables toggled by JS */
        :root {
            --btn-color: #3b82f6;
            --btn-hover: #1d4ed8;
        }
        .custom-btn {
            background-color: var(--btn-color) !important;
            transition: all 0.2s ease-in-out;
        }
        .custom-btn:hover {
            background-color: var(--btn-hover) !important;
        }
        .tab-active {
            border-bottom: 3px solid var(--btn-color);
            color: var(--btn-color);
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">

    <!-- Header & Pengaturan Tema -->
    <header class="border-b border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-tight">🎓 SmartGrade <span class="text-sm font-normal text-gray-500 dark:text-gray-400">| Simulasi IP-IPK</span></h1>
            
            <div class="flex flex-wrap items-center gap-4 text-sm">
                <!-- Pilihan Warna Tombol -->
                <div class="flex items-center gap-2">
                    <label class="font-medium">Warna Tombol:</label>
                    <input type="color" id="btnColorPicker" value="#3b82f6" class="w-7 h-7 rounded cursor-pointer border border-gray-300">
                </div>
                <!-- Pilihan Warna Hover -->
                <div class="flex items-center gap-2">
                    <label class="font-medium">Warna Hover:</label>
                    <input type="color" id="btnHoverPicker" value="#1d4ed8" class="w-7 h-7 rounded cursor-pointer border border-gray-300">
                </div>
                <!-- Toggle Tema -->
                <button id="themeToggle" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 font-semibold cursor-pointer">
                    🌓 Mode Gelap
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Tab Navigasi -->
        <div class="flex border-b border-gray-200 dark:border-gray-700 mb-8">
            <button onclick="switchTab('mk-tab')" id="mk-tab-btn" class="flex-1 py-3 text-center font-medium cursor-pointer tab-active">
                📝 Hitung Nilai 1 Mata Kuliah
            </button>
            <button onclick="switchTab('ipk-tab')" id="ipk-tab-btn" class="flex-1 py-3 text-center font-medium cursor-pointer text-gray-500 dark:text-gray-400">
                📊 Simulasi IP & IPK Akumulatif
            </button>
        </div>

        <!-- ==================== TAB FORM 1: NILAI 1 MK ==================== -->
        <div id="mk-tab" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Input Panel -->
                <div class="md:col-span-1 bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
                    <h3 class="text-lg font-bold border-b border-gray-100 dark:border-gray-700 pb-2">Input Parameter</h3>
                    
                    <div>
                        <label class="block font-medium mb-1">Mode Pilih MK</label>
                        <select id="mkModeSelect" onchange="toggleMkMode()" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                            <option value="otomatis">Otomatis (Kontrak Kuliah Tersedia)</option>
                            <option value="manual">Manual (Isi Komponen Sendiri)</option>
                        </select>
                    </div>

                    <!-- Dropdown MK Otomatis -->
                    <div id="wrapperMkOtomatis">
                        <label class="block font-medium mb-1">Pilih Mata Kuliah</label>
                        <select id="mkOtomatisSelect" onchange="loadOtomatisMkComponents()" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
                    </div>

                    <!-- Input Nama MK Manual -->
                    <div id="wrapperMkManual" class="hidden">
                        <label class="block font-medium mb-1">Nama Mata Kuliah</label>
                        <input type="text" id="mkManualNama" placeholder="Misal: Pemrograman Lanjut" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                    </div>

                    <div>
                        <label class="block font-medium mb-1">Target Nilai / Huruf Mutu <span class="text-xs text-gray-400">(Opsional)</span></label>
                        <select id="targetGradeMk" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                            <option value="">-- Tanpa Target --</option>
                            <option value="A">A (>= 85)</option>
                            <option value="AB">AB (>= 78)</option>
                            <option value="B">B (>= 70)</option>
                            <option value="BC">BC (>= 63)</option>
                            <option value="C">C (>= 55)</option>
                        </select>
                    </div>
                </div>

                <!-- Komponen Dinamis & Hasil -->
                <div class="md:col-span-2 bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2 mb-4">
                            <h3 class="text-lg font-bold">Komponen Penilaian (<span id="totalPersenLabel">0%</span>)</h3>
                            <button id="btnTambahKomponen" onclick="tambahKomponenManualRow()" class="hidden text-xs py-1 px-3 bg-green-600 text-white rounded hover:bg-green-700 cursor-pointer">+ Tambah Komponen</button>
                        </div>

                        <!-- Tempat Baris Komponen Di-generate -->
                        <div id="containerKomponenMk" class="space-y-3 max-h-[350px] overflow-y-auto pr-2"></div>
                    </div>

                    <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700">
                        <button onclick="hitungNilaiAkhirMK()" class="w-full py-3 text-white font-bold rounded-lg shadow custom-btn cursor-pointer">Hitung Nilai Akhir</button>
                        
                        <!-- Output Area -->
                        <div id="hasilMkBox" class="hidden mt-4 p-4 rounded-lg bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600">
                            <div class="grid grid-cols-2 gap-4 text-center">
                                <div class="bg-white dark:bg-gray-800 p-3 rounded-md shadow-sm">
                                    <div class="text-xs text-gray-500">Nilai Angka</div>
                                    <div id="outMkAngka" class="text-2xl font-black text-blue-600 dark:text-blue-400">0.00</div>
                                </div>
                                <div class="bg-white dark:bg-gray-800 p-3 rounded-md shadow-sm">
                                    <div class="text-xs text-gray-500">Huruf Mutu</div>
                                    <div id="outMkHuruf" class="text-2xl font-black text-purple-600 dark:text-purple-400">-</div>
                                </div>
                            </div>
                            <!-- Opsi Peningkatan Target -->
                            <div id="opsiTargetMkBox" class="mt-4 p-3 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 rounded-md text-sm hidden"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== TAB FORM 2: SIMULASI IP-IPK ==================== -->
        <div id="ipk-tab" class="space-y-6 hidden">
            <!-- Data Historis 2 Semester Awal -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                <h3 class="text-lg font-bold border-b border-gray-100 dark:border-gray-700 pb-2 mb-4">📍 Basis Data Transkrip Historis (Semester 1 & 2)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Total SKS Terkondisi (Sem 1+2)</label>
                        <input type="number" id="sksLalu" value="38" min="0" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">IPK Kumulatif Awal (Sem 1+2)</label>
                        <input type="number" id="ipkLalu" value="3.45" step="0.01" min="0" max="4" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Total Bobot SKS Awal</label>
